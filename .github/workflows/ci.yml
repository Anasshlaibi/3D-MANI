name: Deterministic Manufacturing Engine CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-tests:
    name: Python Manufacturing Engine Tests & Typing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lark pydantic fastapi uvicorn pyyaml numpy pytest pytest-cov mypy

      - name: Run Python Type Check (Mypy)
        run: |
          mypy engine/manufacturing_engine --ignore-missing-imports || true

      - name: Run Python Deterministic Test Suite
        run: |
          pytest engine/manufacturing_engine/tests -v --cov=engine/manufacturing_engine

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run lint

      - name: Build Web Frontend
        run: npm run build
